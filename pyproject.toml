[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-atlas-ai"
version = "0.1.0"
description = "Local-first multi-asset intelligence, regime analytics, and strategy research platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sapphire Research" }
]
dependencies = [
  "duckdb>=1.1.3",
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "requests>=2.32.3",
  "python-dateutil>=2.9.0.post0",
  "python-dotenv>=1.0.1",
  "yfinance>=0.2.43",
  "pydantic>=2.9.2",
  "matplotlib>=3.9.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.7.0",
]

[project.scripts]
market-atlas = "market_atlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
